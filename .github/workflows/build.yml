name: Build BASILISK-X APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q BASILISK-X_Standalone_v0_6.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS tests
        working-directory: BASILISK-X_v0.6
        run: |
          node tests/indicators.test.js
          node tests/indicator_parity.test.js
          node tests/backtest.test.js
          node tests/backtest_edge.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: BASILISK-X_v0.6/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BASILISK-X-debug-apk
          path: BASILISK-X_v0.6/android/app/build/outputs/apk/debug/*.apk
